name: Report a problem
description: Something doesn't work
title: "Problem: "
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → About This Mac
      placeholder: "26.4.1"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Where?
      options:
        - Mac app
        - iPhone app
        - Website
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
